name: CI

on:
  push:
    branches: [main]
    paths:
      - 'personalized-adventure-backend/**'
      - 'PersonalizedAdventureApp/**'
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'personalized-adventure-backend/**'
      - 'PersonalizedAdventureApp/**'
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/ci-cd.yml'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: ${{ hashFiles('personalized-adventure-backend/package.json') != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: personalized-adventure-backend
        run: npm install

      - name: Run backend tests
        working-directory: personalized-adventure-backend
        run: npm test -- --runInBand

  python-bot-smoke:
    name: Python Bot Smoke Check
    runs-on: ubuntu-latest
    if: ${{ hashFiles('requirements.txt') != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: |
          python -m py_compile config.py coinbase_feed.py crypto_com_feed.py webull_feed.py kalshi_client.py features.py historical_loader.py train_model.py predict.py bot.py
